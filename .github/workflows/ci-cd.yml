name: CI/CD Pipeline

on:
  # Run on every push to feature branches and on Pull Requests targeting main
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - main
  pull_request:
    branches:
      - main

jobs:
  # ----------------------------------------
  # Job 1: Code Quality (Linting)
  # ----------------------------------------
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (code quality)
        run: npm run lint

      - name: Run Prettier check (formatting)
        run: npm run format:check

  # ----------------------------------------
  # Job 2: Unit Tests
  # ----------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality   # Only run tests if code quality passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ----------------------------------------
  # Job 3: Deploy to Staging (only on main)
  # ----------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    # Only deploy when code is pushed to the main branch (after successful merge)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: staging
      url: https://staging.example.com   # Replace with your real staging URL

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Example deployment commands (replace with your actual deployment method):
          # - rsync, scp, AWS S3, Vercel, Netlify, Docker, Kubernetes, etc.
          # Example for a simple static site or Node app:
          # npm run deploy:staging
          echo "Deployment to staging completed successfully."

      - name: Notify team (optional)
        run: echo "Staging deployment succeeded for commit ${{ github.sha }}"
